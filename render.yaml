services:
  - type: web
    name: koyo-line-bot
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: ADMIN_USERNAME
        value: admin
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOT_SYSTEM_PROMPT
        sync: false
      - key: ADMIN_LINE_USER_ID
        sync: false
